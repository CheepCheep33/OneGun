name: Test and deploy web build

# Every push runs the smoke test, exports the web build, and deploys it to Cloudflare Pages.
# Pushes to main update the production site; other branches get their own preview URL.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  PAGES_PROJECT: onegun

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$templates"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz 'templates/web_*' 'templates/version.txt' -d "$templates"
          rm godot.zip templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --editor --quit --path .

      - name: Smoke test
        run: ~/godot/godot --headless --path . res://tests/smoke_test.tscn

      - name: Reforge simulation (plan gate)
        run: ~/godot/godot --headless --path . res://tests/reforge_sim.tscn

      - name: Export web build
        run: |
          mkdir -p build/web
          touch build/.gdignore # keep Godot from importing the export output
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck
          # Pages caps files at 25 MiB; ship the engine gzipped and decompress it in the browser.
          cp web/wasm_gzip_loader.js build/web/
          gzip -9 -c build/web/index.wasm > build/web/index.wasm.gz.bin
          rm build/web/index.wasm
          ls -la build/web

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creating the project fails harmlessly once it already exists.
          npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch main || true
          npx --yes wrangler@3 pages deploy build/web --project-name "$PAGES_PROJECT" \
            --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-dirty=true
